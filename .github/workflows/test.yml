# The unit tests, and the golden-image tests of tests/screens.rs, which
# draw off-screen in a window on a virtual X display.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for a window on X
        run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1
      - name: Test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --release
      - name: Keep what was drawn differently
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: tests/screens/*.new.png
          if-no-files-found: ignore
