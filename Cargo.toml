[package]
name = "jog"
version = "0.1.0"
edition = "2021"
description = "An extremely fast, lightweight image viewer"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = "6"
memchr = "2"
fontdue = "0.9"
kamadak-exif = "0.6"
bytemuck = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Decoding in an unoptimised build is unusably slow.
[profile.dev.package."*"]
opt-level = 3
