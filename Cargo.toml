[package]
name = "jog"
version = "0.1.0"
edition = "2021"
description = "An extremely fast, lightweight image viewer"
license = "MIT"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "tga", "ico", "qoi", "hdr", "exr", "dds", "ff", "pnm"] }
fast_image_resize = { version = "6", features = ["rayon", "bytemuck"] }
memchr = "2"
fontdue = "0.9"
# Emoji are pictures kept in the system's color emoji font, read with this.
ttf-parser = "0.25"
# Fills the outlines of the layers Twemoji is made of.
ab_glyph_rasterizer = "0.1"
kamadak-exif = "0.6"
bytemuck = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
libloading = "0.9"
libc = "0.2"
rayon = "1"
jxl-oxide = { version = "0.12.6", features = ["image"] }
# Encoders for Convert, all built from source with no tools beyond a C
# compiler: rav1e's and mozjpeg's assembly would need NASM, so they go
# without it.
jixel = "0.4.2"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = "0.8"
mozjpeg = { version = "0.10", default-features = false, features = ["parallel"] }
webp = { version = "0.3.1", default-features = false }
# How near a converted picture is to the original, for the Convert panel.
ssimulacra2 = "0.5"
serde_json = "1"
# A PNG's color profile is stored compressed.
miniz_oxide = "0.8"

# No cross-crate LTO and 16 codegen units, Cargo's own default: a rebuild
# takes 36 s rather than 170 s (fat LTO with one unit, a single core for
# all of it), and the binary is 3.6 MB larger. Measured 2026-10-19 with no
# difference in start, decode, drawing, video or encoding beyond noise.
[profile.release]
opt-level = 3
panic = "abort"
strip = true

# Decoding in an unoptimised build is unusably slow.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
vergen-gitcl = "10.0.3"
